version: '3.8'

services:
  openclaw-enterprise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-enterprise
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - OPENCLAW_MODE=enterprise
      - OPENCLAW_ORG_NAME=${OPENCLAW_ORG_NAME:-Enterprise Corp}
      - OPENCLAW_ORG_DOMAIN=${OPENCLAW_ORG_DOMAIN:-enterprise.com}
      - OPENCLAW_ADMIN_EMAIL=${OPENCLAW_ADMIN_EMAIL:-admin@enterprise.com}
      - OPENCLAW_SUPPORT_EMAIL=${OPENCLAW_SUPPORT_EMAIL:-support@enterprise.com}
      - OPENCLAW_REQUIRE_MFA=${OPENCLAW_REQUIRE_MFA:-true}
      - OPENCLAW_SESSION_TIMEOUT=${OPENCLAW_SESSION_TIMEOUT:-3600}
      - OPENCLAW_MAX_REQUESTS_PER_HOUR=${OPENCLAW_MAX_REQUESTS_PER_HOUR:-100}
      - OPENCLAW_CONTENT_FILTERING=${OPENCLAW_CONTENT_FILTERING:-true}
      - OPENCLAW_AUDIT_LOGGING=${OPENCLAW_AUDIT_LOGGING:-true}
      - OPENCLAW_GDPR_ENABLED=${OPENCLAW_GDPR_ENABLED:-true}
      - OPENCLAW_HIPAA_MODE=${OPENCLAW_HIPAA_MODE:-false}
      - OPENCLAW_DATA_RESIDENCY=${OPENCLAW_DATA_RESIDENCY:-us}
      - DATABASE_URL=postgresql://openclaw:${POSTGRES_PASSWORD}@postgres:5432/openclaw_enterprise
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "18789:18789"
      - "3000:3000"  # Dashboard UI
    volumes:
      - openclaw_data:/app/data
      - openclaw_logs:/app/logs
      - ./enterprise-config:/app/config
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - openclaw-enterprise

  postgres:
    image: postgres:15-alpine
    container_name: openclaw-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=openclaw_enterprise
      - POSTGRES_USER=openclaw
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openclaw-enterprise

  redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme456}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme456}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - openclaw-enterprise

  nginx:
    image: nginx:alpine
    container_name: openclaw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - openclaw_logs:/var/log/nginx
    depends_on:
      - openclaw-enterprise
    networks:
      - openclaw-enterprise

  prometheus:
    image: prom/prometheus:latest
    container_name: openclaw-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - openclaw-enterprise

  grafana:
    image: grafana/grafana:latest
    container_name: openclaw-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - openclaw-enterprise

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: openclaw-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=openclaw-es
      - cluster.name=openclaw-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - openclaw-enterprise

  kibana:
    image: kibana:8.11.0
    container_name: openclaw-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - openclaw-enterprise

volumes:
  openclaw_data:
  openclaw_logs:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  openclaw-enterprise:
    driver: bridge